    # BEGIN MAESTRO PREVIEW
    location = /maestro { return 302 /maestro/; }
    location = /maestro/les-pizzas/ { return 302 /maestro/menu.html; }
    location ^~ /maestro/ {
        alias /var/www/maestro/current/public/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location ~ /\. { deny all; }
        # Static preview only: never expose PHP sources.
        location ~ \.php$ { return 404; }
    }
    # END MAESTRO PREVIEW
