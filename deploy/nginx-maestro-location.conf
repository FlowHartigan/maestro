    # BEGIN MAESTRO PREVIEW
    location = /maestro { return 302 /maestro/; }
    location = /maestro/les-pizzas/ { return 302 /maestro/menu.html; }
    location = /maestro/administration { return 302 /maestro/administration/; }
    location = /maestro/index.php { return 302 /maestro/; }
    location = /maestro/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        client_max_body_size 7m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/maestro/current/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9084;
    }
    location = /maestro/index.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        client_max_body_size 7m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/maestro/current/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9084;
    }
    location = /maestro/menu.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        client_max_body_size 7m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/maestro/current/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9084;
    }
    location = /maestro/contact.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        client_max_body_size 7m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/maestro/current/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9084;
    }
    location = /maestro/api/index.php {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        client_max_body_size 7m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/maestro/current/public/api/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:9084;
    }
    location ^~ /maestro/uploads/ {
        alias /var/www/maestro/shared/uploads/;
        autoindex off;
        if ($uri !~ "^/maestro/uploads/[a-f0-9]{40}\.webp$") { return 404; }
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ^~ /maestro/ {
        alias /var/www/maestro/current/public/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location ~ /\. { deny all; }
        location ~ \.php$ { return 404; }
    }
    # END MAESTRO PREVIEW
